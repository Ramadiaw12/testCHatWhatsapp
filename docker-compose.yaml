# Le containers 
services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:ragdb}
      POSTGRES_USER: ${POSTGRES_USER:raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"
  
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: